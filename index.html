<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thư viện Mô hình 3D</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; margin-top: 20px; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 8px; }
        .card h4 { margin: 0 0 8px 0; word-break: break-all; }
        .btn { display: inline-block; background: #007bff; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; margin-top: 10px; }
        input { padding: 8px; width: 100%; max-width: 400px; background: #222; border: 1px solid #444; color: white; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="app">
        <h2>📦 Thư viện Mô hình 3D</h2>
        <input type="text" id="searchBox" placeholder="🔍 Tìm kiếm mô hình..." onkeyup="filterModels()">
        <div id="modelGrid" class="grid">Đang tải danh sách thư viện...</div>
    </div>

    <script>
        // Thay bằng URL Cloudflare Tunnel hiện tại của bạn
        const TUNNEL_URL = "https://your-tunnel-url.trycloudflare.com";

        async function loadGallery() {
            try {
                let res = await fetch(`${TUNNEL_URL}/models/index.json`);
                let models = await res.json();
                window.allModels = models;
                renderGrid(models);
            } catch (e) {
                document.getElementById('modelGrid').innerHTML = "<p style='color:red;'>Không thể kết nối đến máy chủ Raspberry Pi hoặc tunnel đã đổi link!</p>";
            }
        }

        function renderGrid(models) {
            let grid = document.getElementById('modelGrid');
            grid.innerHTML = "";
            models.forEach(m => {
                let card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <h4>${m.name}</h4>
                    <p style="font-size: 12px; color: #aaa; margin: 0;">Dung lượng: ${m.size_mb} MB | ${m.date}</p>
                    <a href="?file=${TUNNEL_URL}/models/${encodeURIComponent(m.name)}" class="btn">👁 Xem 3D</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterModels() {
            let keyword = document.getElementById('searchBox').value.toLowerCase();
            let filtered = window.allModels.filter(m => m.name.toLowerCase().includes(keyword));
            renderGrid(filtered);
        }

        // Kiểm tra nếu có ?file= trên URL thì chuyển sang chế độ tích hợp Three.js xem 3D
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('file')) {
            document.getElementById('app').innerHTML = "<h2>Đang tải mô hình 3D...</h2>";
            // Code khởi tạo Three.js load file của bạn đặt ở đây
        } else {
            loadGallery();
        }
    </script>
</body>
</html>
