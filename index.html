<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D STL Viewer</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { margin: 0; background: #121212; overflow: hidden; color: #fff; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #status {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px; text-align: center;
      background: rgba(0,0,0,0.7); padding: 12px 20px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="status">⏳ Đang khởi tạo mô hình...</div>
  <div id="canvas-container"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const fileUrl = urlParams.get('file');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const gridHelper = new THREE.GridHelper(200, 20, 0x444444, 0x222222);
    gridHelper.position.y = -50;
    scene.add(gridHelper);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight1.position.set(100, 200, 100);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x90caf9, 0.5);
    dirLight2.position.set(-100, -100, -100);
    scene.add(dirLight2);

    if (fileUrl) {
      const loader = new THREE.STLLoader();
      document.getElementById('status').innerText = '⏳ Đang tải file 3D...';
      
      loader.load(
        fileUrl,
        function (geometry) {
          document.getElementById('status').style.display = 'none';
          geometry.center();
          const material = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            roughness: 0.35,
            metalness: 0.15
          });
          const mesh = new THREE.Mesh(geometry, material);
          scene.add(mesh);

          geometry.computeBoundingSphere();
          const radius = geometry.boundingSphere.radius;
          camera.position.set(radius * 1.5, radius * 1.5, radius * 2.0);
          camera.lookAt(0, 0, 0);
          controls.maxDistance = radius * 10;
          controls.minDistance = radius * 0.2;
          controls.update();
        },
        function (xhr) {
          if (xhr.lengthComputable) {
            const percent = Math.round((xhr.loaded / xhr.total) * 100);
            document.getElementById('status').innerText = `⏳ Đang tải: ${percent}%`;
          }
        },
        function (error) {
          document.getElementById('status').innerText = '❌ Không thể tải hoặc định dạng STL không hợp lệ';
        }
      );
    } else {
      document.getElementById('status').innerText = '❌ Cần đường dẫn file (?file=...)';
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
